include: package:flutter_lints/flutter.yaml

# Keep the demo gate focused on errors and warnings. These info-level rules are
# existing migration debt and are intentionally deferred until after the demo.
analyzer:
  errors:
    curly_braces_in_flow_control_structures: ignore
    deprecated_member_use: ignore
    unnecessary_underscores: ignore
    use_build_context_synchronously: ignore
    use_super_parameters: ignore
